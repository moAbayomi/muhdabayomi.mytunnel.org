name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — check, test, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do NOT pass `version` here: package.json already declares
      # "packageManager": "pnpm@11.17.0", and pnpm/action-setup fails when both
      # are set. One source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter api check

      # Tests are optional. They create and delete rows, so they must never run
      # against production. If DATABASE_URL_TEST is set (a Neon branch or a
      # local dev database), run them; otherwise deploy still proceeds.
      - name: Check for a test database
        id: testdb
        run: |
          if [ -n "$DATABASE_URL_TEST" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

      - name: Write test env
        if: steps.testdb.outputs.available == 'true'
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL_TEST" > api/.dev.vars
        env:
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}

      - name: Migrate test database and run tests
        if: steps.testdb.outputs.available == 'true'
        run: |
          pnpm --filter api db:migrate
          pnpm --filter api test

      - name: Tests skipped
        if: steps.testdb.outputs.available != 'true'
        run: echo "No DATABASE_URL_TEST secret - skipping integration tests."

      # Fail with a named setting instead of an opaque wrangler error.
      - name: Check deploy configuration
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -n "$WEB_ORIGIN" ] || { echo "::error::Missing variable WEB_ORIGIN (e.g. https://moyomi.xyz)"; missing=1; }
          exit $missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}

      # Uses the pinned wrangler from api/devDependencies rather than the
      # wrangler-action wrapper, so the actual error is in the log.
      - name: Deploy Worker
        working-directory: api
        run: pnpm exec wrangler deploy --var WEB_ORIGIN:"$WEB_ORIGIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}

  web:
    name: web — build, deploy to Pages
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Pages configuration
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -n "$PUBLIC_API_URL" ] || { echo "::error::Missing variable PUBLIC_API_URL (e.g. https://api.moyomi.xyz)"; missing=1; }
          [ -n "$PAGES_PROJECT" ] || { echo "::error::Missing variable PAGES_PROJECT"; missing=1; }
          exit $missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}

      # The build fetches published notes from the deployed API, so this job
      # must run after `api` (needs: api) and PUBLIC_API_URL must be reachable.
      - name: Build
        run: pnpm --filter web build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Pages
        run: api/node_modules/.bin/wrangler pages deploy web/dist --project-name="$PAGES_PROJECT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
